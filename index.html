<!DOCTYPE html>
<html lang="sw" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGAMBA SHAMBA | System</title>
<style>
:root {
  --bg-color: #f4f6f4;
  --panel-bg: #ffffff;
  --text-color: #1a231e;
  --primary-color: #176b45;
  --sidebar-bg: #0d281c;
  --font-family: 'Inter', system-ui, sans-serif;
  --font-size: 14px;
}

body {
  margin: 0;
  font-family: var(--font-family);
  font-size: var(--font-size);
  background: var(--bg-color);
  color: var(--text-color);
}

.hidden { display: none !important; }
.app-layout { display: flex; min-height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 250px;
  background: var(--sidebar-bg);
  color: white;
  padding: 20px 15px;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.brand img { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; }

.nav-btn {
  width: 100%;
  padding: 12px 15px;
  margin-top: 5px;
  background: transparent;
  border: 0;
  color: #b3c5b9;
  text-align: left;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  font-size: inherit;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--primary-color);
  color: white;
}

/* MAIN CONTENT */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 65px;
  background: var(--panel-bg);
  border-bottom: 1px solid #e0e6e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
}

.content { padding: 25px; flex: 1; overflow-y: auto; }

/* PANELS & CARDS */
.panel {
  background: var(--panel-bg);
  border: 1px solid #e0e6e1;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
.card { background: var(--panel-bg); padding: 18px; border-radius: 12px; border: 1px solid #e0e6e1; }
.card-val { font-size: 22px; font-weight: 800; margin-top: 8px; }

/* FORMS & BUTTONS */
.btn {
  background: var(--primary-color);
  color: white;
  border: 0;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}

.btn-outline { background: transparent; border: 1px solid #ccc; color: inherit; }

.field { margin-bottom: 15px; }
label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 12px; }
input, select, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
  font-family: inherit;
}

/* LOGIN */
.login-bg {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0d281c, #176b45);
}

.login-card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  width: 100%;
  max-width: 380px;
  color: #1a231e;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-bg">
  <div class="login-card">
    <div style="text-align:center; margin-bottom:15px;">
      <span id="loginLogoText" style="font-size:35px;">🌱</span>
      <h2 id="loginTitle" style="margin:5px 0;">IGAMBA SHAMBA</h2>
      <p style="color:#666; font-size:12px;">Mfumo wa Usimamizi wa Shamba</p>
    </div>

    <div class="field">
      <label>Lugha / Language</label>
      <select onchange="setLang(this.value)">
        <option value="sw">Swahili</option>
        <option value="en">English</option>
      </select>
    </div>

    <form onsubmit="event.preventDefault(); login();">
      <div class="field">
        <label>Barua pepe / Email</label>
        <input type="email" value="admin@igamba.com" required>
      </div>
      <div class="field">
        <label>Nenosiri / Password</label>
        <input type="password" value="123456" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Ingia Mfumoni →</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="app-layout hidden">
  <aside class="sidebar">
    <div class="brand">
      <span id="appLogoIcon">🌱</span>
      <span id="appLogoName">IGAMBA SHAMBA</span>
    </div>
    <div style="margin-top:20px;">
      <button class="nav-btn active" onclick="showTab('dash')" id="tabDashBtn">▦ Muhtasari</button>
      <button class="nav-btn" onclick="showTab('fin')" id="tabFinBtn">💰 Fedha & Mtaji</button>
      <button class="nav-btn" onclick="showTab('gal')" id="tabGalBtn">📷 Picha za Shamba</button>
      <button class="nav-btn" onclick="showTab('appear')" id="tabAppearBtn">🎨 Muonekano (Admin)</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h3 id="topTitle" style="margin:0;">Muhtasari wa Shamba</h3>
      <div style="display:flex; gap:10px;">
        <button class="btn-outline btn" onclick="toggleTheme()" id="themeBtn">🌙 Mwanga</button>
        <button class="btn-outline btn" onclick="logout()">↪ Toka</button>
      </div>
    </header>

    <div class="content">

      <!-- DASHBOARD -->
      <section id="dashTab">
        <div class="grid-4">
          <div class="card">
            <div style="color:#666; font-size:12px;" id="lblSales">Mauzo ya Shamba</div>
            <div class="card-val" style="color:#176b45;" id="valSales">TZS 0</div>
          </div>
          <div class="card">
            <div style="color:#666; font-size:12px;" id="lblCapital">Mtaji wa Mmiliki</div>
            <div class="card-val" style="color:#2b7fff;" id="valCapital">TZS 0</div>
          </div>
          <div class="card">
            <div style="color:#666; font-size:12px;" id="lblExpenses">Jumla ya Matumizi</div>
            <div class="card-val" style="color:#d9534f;" id="valExpenses">TZS 0</div>
          </div>
          <div class="card">
            <div style="color:#666; font-size:12px;" id="lblNet">Salio la Mfukoni</div>
            <div class="card-val" id="valNet">TZS 0</div>
          </div>
        </div>
      </section>

      <!-- FINANCES -->
      <section id="finTab" class="hidden">
        <div class="panel">
          <h3>Ongeza Muamala au Mtaji</h3>
          <form onsubmit="event.preventDefault(); addTx();" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
            <div class="field">
              <label>Aina ya Muamala</label>
              <select id="txType">
                <option value="income">Mauzo ya Shamba</option>
                <option value="capital">Mtaji Kutoka kwa Mmiliki</option>
                <option value="expense">Matumizi ya Shamba</option>
              </select>
            </div>
            <div class="field">
              <label>Kiasi (TZS)</label>
              <input type="number" id="txAmt" required>
            </div>
            <div class="field">
              <label>Maelezo</label>
              <input type="text" id="txDesc" placeholder="Mfano: Chakula cha Kuku" required>
            </div>
            <div style="grid-column: 1 / -1;">
              <button type="submit" class="btn">Hifadhi Muamala</button>
            </div>
          </form>
        </div>
      </section>

      <!-- GALLERY -->
      <section id="galTab" class="hidden">
        <div class="panel">
          <h3>Pakia Picha ya Shamba</h3>
          <input type="file" id="imgInput" accept="image/*" style="margin-bottom:10px;">
          <button class="btn" onclick="uploadImg()">Pakia Picha</button>
        </div>
        <div id="imgGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:15px;"></div>
      </section>

      <!-- APPEARANCE (ADMIN) -->
      <section id="appearTab" class="hidden">
        <div class="panel">
          <h3>🎨 Mipangilio ya Muonekano (Appearance Settings)</h3>
          
          <div class="field">
            <label>Logo ya Shamba (Weka Link au Emoji)</label>
            <input type="text" id="appLogoInput" value="🌱" onchange="updateLogo(this.value)">
          </div>

          <div class="field">
            <label>Rangi Kuu (Primary Color)</label>
            <input type="color" id="primaryColorInput" value="#176b45" onchange="updatePrimaryColor(this.value)">
          </div>

          <div class="field">
            <label>Aina ya Maandishi (Font Family)</label>
            <select onchange="updateFont(this.value)">
              <option value="'Inter', sans-serif">Inter (Modern & Clean)</option>
              <option value="'Segoe UI', sans-serif">Segoe UI</option>
              <option value="Georgia, serif">Georgia (Serif)</option>
              <option value="monospace">Monospace</option>
            </select>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>

<script>
let lang = 'sw';
let sales = 120000, capital = 500000, expenses = 45000;

function login() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  calc();
}

function logout() {
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

function showTab(tab) {
  ['dashTab', 'finTab', 'galTab', 'appearTab'].forEach(t => document.getElementById(t).classList.add('hidden'));
  document.getElementById(tab + 'Tab').classList.remove('hidden');
}

function calc() {
  document.getElementById('valSales').textContent = 'TZS ' + sales.toLocaleString();
  document.getElementById('valCapital').textContent = 'TZS ' + capital.toLocaleString();
  document.getElementById('valExpenses').textContent = 'TZS ' + expenses.toLocaleString();
  document.getElementById('valNet').textContent = 'TZS ' + ((sales + capital) - expenses).toLocaleString();
}

function addTx() {
  let type = document.getElementById('txType').value;
  let amt = Number(document.getElementById('txAmt').value);
  
  if (type === 'income') sales += amt;
  if (type === 'capital') capital += amt;
  if (type === 'expense') expenses += amt;
  
  calc();
  alert('Muamala umehifadhiwa!');
  showTab('dash');
}

function updateLogo(val) {
  document.getElementById('loginLogoText').textContent = val;
  document.getElementById('appLogoIcon').textContent = val;
}

function updatePrimaryColor(val) {
  document.documentElement.style.setProperty('--primary-color', val);
}

function updateFont(val) {
  document.documentElement.style.setProperty('--font-family', val);
}

function toggleTheme() {
  let bg = document.documentElement.style.getPropertyValue('--bg-color');
  if (bg === '#121212') {
    document.documentElement.style.setProperty('--bg-color', '#f4f6f4');
    document.documentElement.style.setProperty('--panel-bg', '#ffffff');
    document.documentElement.style.setProperty('--text-color', '#1a231e');
  } else {
    document.documentElement.style.setProperty('--bg-color', '#121212');
    document.documentElement.style.setProperty('--panel-bg', '#1e1e1e');
    document.documentElement.style.setProperty('--text-color', '#ffffff');
  }
}
</script>
</body>
</html>
